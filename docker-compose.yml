version: "3"

services:
  op-db:
    image: postgres:14-alpine
    restart: always
    volumes:
      - ./docker/data/op-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  op-kv:
    image: redis:7.2.5-alpine
    restart: always
    volumes:
      - ./docker/data/op-kv-data:/data
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - 6379:6379

  op-ch:
    image: clickhouse/clickhouse-server:26.1.3.52
    restart: always
    volumes:
      - ./docker/data/op-ch-data:/var/lib/clickhouse
      - ./docker/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml
      - ./docker/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml
      - ./docker/clickhouse/clickhouse-telemetry-profile.xml:/etc/clickhouse-server/users.d/op-telemetry-profile.xml:ro
      - ./docker/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      CLICKHOUSE_DB: openpanel
      CLICKHOUSE_SKIP_USER_SETUP: 1
      # Read by docker/clickhouse/init-db.sh on first boot.
      CLICKHOUSE_TELEMETRY_DB: openpanel_telemetry
      CLICKHOUSE_TELEMETRY_PASSWORD: gigapipe
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native/TCP interface
      - "9009:9009" # Inter-server communication

  op-gigapipe:
    image: ${GIGAPIPE_IMAGE:-ghcr.io/metrico/gigapipe:latest}
    restart: always
    depends_on:
      - op-ch
    environment:
      CLICKHOUSE_SERVER: op-ch
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: openpanel_telemetry
      CLICKHOUSE_AUTH: gigapipe:gigapipe
      # Auth stays on in dev too — gigapipe only installs the middleware when
      # both are non-empty, and dev is where you would notice it missing.
      QRYN_LOGIN: openpanel
      QRYN_PASSWORD: openpanel-dev
      ADVANCED_OMIT_EMPTY_VALUES: "true"
      LOG_DRILLDOWN: "true"
      SAMPLES_DAYS: "30"
      PORT: 3100
    ports:
      # Published here, unlike self-hosting: in dev the apps run on the host
      # via `pnpm dev`, not on the compose network.
      - "3100:3100"

  op-rp:
    image: redpandadata/redpanda:v25.1.4
    restart: always
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://op-rp:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=op-rp:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=info
    volumes:
      - ./docker/data/op-rp-data:/var/lib/redpanda/data
      - ./docker/redpanda/bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    ports:
      - "19092:19092" # Kafka API (external)
      - "9644:9644"   # Admin API

  op-rp-console:
    image: redpandadata/console:v3.7.2
    restart: always
    depends_on:
      - op-rp
    environment:
      KAFKA_BROKERS: op-rp:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://op-rp:9644
    ports:
      - "8091:8080"
